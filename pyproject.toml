[project]
name = "vendor-orchestration"
version = "0.1.0"
description = "Asynchronous KYC and sanctions screening orchestration service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "celery[redis]>=5.4,<6",
  "pydantic-settings>=2.6,<3",
  "itsdangerous>=2.2,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
