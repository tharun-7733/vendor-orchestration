name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check app
      - run: python -m compileall -q app
      - run: docker build -t vendor-orchestration:${{ github.sha }} .

  deploy-production:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Point production frontend to the Render API
        run: python ../scripts/configure_vercel_proxy.py
        working-directory: public
        env:
          API_ORIGIN: ${{ vars.RENDER_API_ORIGIN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@48.1.8
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: public
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: public
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: public
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
